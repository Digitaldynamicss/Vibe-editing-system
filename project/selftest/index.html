<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
      .caption {
        position: absolute; left: 80px; right: 160px; top: 1180px;
        text-align: center; font-size: 84px; font-weight: 800; line-height: 1.1;
        color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.8);
      }
      .caption .key { color: #ffd23f; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.13"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="selftest-take.mp4"
        playsinline
        data-start="0"
        data-duration="7.13"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" data-has-audio="true"></video>
      

      <div id="cap0" class="clip caption" data-start="0.00" data-duration="1.02" data-track-index="1">Hello, this is</div>
      <div id="cap1" class="clip caption" data-start="1.02" data-duration="0.76" data-track-index="1">a short test</div>
      <div id="cap2" class="clip caption" data-start="1.78" data-duration="1.90" data-track-index="1">for <span class="key">Ideabro</span> Studio.</div>
      <div id="cap3" class="clip caption" data-start="3.68" data-duration="1.10" data-track-index="1">First, zoom in</div>
      <div id="cap4" class="clip caption" data-start="4.78" data-duration="1.14" data-track-index="1">on my hand.</div>
      <div id="cap5" class="clip caption" data-start="5.92" data-duration="1.21" data-track-index="1">Now render it.</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Punch-in on "zoom", hold two seconds, ease back out.
      tl.to("#a-roll", { scale: 1.2, duration: 0.35, ease: "power2.out" }, 4.38);
      tl.to("#a-roll", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 6.38);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
